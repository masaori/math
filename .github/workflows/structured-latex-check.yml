name: structured-latex check

# 証明の構造化テキストの機械検査。
# 存在しないラベルへの参照は型検査で落ちる。
on:
  push:
    paths:
      - 'exact-solution-of-2d-ising-model/structured-latex/**'
      - 'exact-solution-of-2d-ising-model/sagemath/**'
      # 入力言語の正本・生成器・共有HTMLレンダラーはシステム側にある
      # （証明はこれを使う側）。
      - 'structured-latex/**'
      - '.github/workflows/structured-latex-check.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exact-solution-of-2d-ising-model/structured-latex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # .ts を型ストリップで直接実行するため 22.18 以上が要る。
          node-version: '22'
      # 入力言語の正本（structured-latex/ システム）の依存も要る。証明側から import しており、
      # zod の解決はシステム側のディレクトリを起点に行われるため、ここを入れないと解決できない。
      - name: Install system dependencies (structured-latex)
        working-directory: structured-latex
        run: pnpm install --frozen-lockfile
      # 入力言語の正本と、各論文が共有する既定UI（章ナビゲーション等）自体の検査。
      # ここを回さないと、共有レンダラーの単体テストが CI で一度も実行されない。
      - name: Check system (structured-latex)
        working-directory: structured-latex
        run: npm run check
      - run: pnpm install --frozen-lockfile
      # 生成物の鮮度 → 型検査 → 実行時検証 → 移行漏れ検出 → 負テスト → 実行時検証テスト。
      - run: npm run check
      - name: verify check linkage (sagemath ↔ proof)
        working-directory: exact-solution-of-2d-ising-model
        run: node sagemath/tools/verify-check-linkage.ts
