name: structured-latex check

# 証明の構造化テキストの機械検査。
# 生成ラベルの鮮度 → 型検査（存在しないラベルへの参照はここで落ちる）→ 実行時検証 → 負テスト。
on:
  push:
    paths:
      - 'exact-solution-of-2d-ising-model/structured-latex/**'
      - 'exact-solution-of-2d-ising-model/sagemath/tools/**'
      - 'realtime-web-preview/tsconfig.base.json'
      - '.github/workflows/structured-latex-check.yml'
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exact-solution-of-2d-ising-model/structured-latex
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          # .ts を型ストリップで直接実行するため 22.18 以上が要る。
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - run: npm run check
      - name: verify no lost proofs
        run: node tools/verify-no-lost-proofs.ts
      - name: verify check linkage (sagemath ↔ proof)
        working-directory: exact-solution-of-2d-ising-model
        run: node sagemath/tools/verify-check-linkage.mjs
