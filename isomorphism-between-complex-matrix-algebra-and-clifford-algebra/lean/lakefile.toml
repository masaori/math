name = "CliffordMatrixIsomorphism"
defaultTargets = ["CliffordMatrixIsomorphism"]

# mathlib4 は Lean toolchain と同じタグ v4.32.1 に固定する。
# lean-toolchain (leanprover/lean4:v4.32.1) と必ず対にして更新すること。
# 版は exact-solution-of-2d-ising-model/lean/ と揃える。
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[lean_lib]]
name = "CliffordMatrixIsomorphism"
