name = "CellularAutomata"
defaultTargets = ["CellularAutomata"]

# mathlib4 は Lean toolchain と同じタグに固定する。
# lean-toolchain と必ず対にして更新すること。
# 2 次元側（Ising2DLambda）と同じ版に揃えてある（依存を clone copy で持ち込めるようにするため）。
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.32.1"

[[lean_lib]]
name = "CellularAutomata"
